[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cragradar-backend"
version = "0.1.0"
description = "CragRadar backend: API, on-demand tile server and ingest worker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "pyvips[binary]>=2.2.2",
    "uvicorn[standard]>=0.32",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx2>=2.14",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
